# Light painted surface, ink text,
# blue = positive gamma / calls, red = negative gamma / puts, never green for status.
[theme]
base = "light"
primaryColor = "#0b0b0b"
backgroundColor = "#fcfcfb"
secondaryBackgroundColor = "#f0efec"
textColor = "#0b0b0b"
blueColor = "#2a78d6"
redColor = "#e34948"
font = "sans serif"

[client]
toolbarMode = "minimal"

[browser]
gatherUsageStats = false
